# A multi-line string holds a line that starts with "[". The end of the
# first block looks like it is before the string's end, so the edit does not
# read back as the original and is refused.
[github]
app-client-id = "Iv1.example"
app-private-key-file = "/keys/app.pem"

[[targets]]
url = "https://github.com/acme/api"
max-runners = 2
note = """
[a line of the note, not a table]
more of the note"""

[[targets]]
url = "https://github.com/acme/web"
max-runners = 3
