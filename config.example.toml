# Example configuration for actions-runner-scaler.
# Replace every <placeholder>. Keys marked "default" may be left out.
# Secrets are referenced by path only.

[github]
# The default credential of every target: a GitHub App (these two keys) or a
# personal access token file, not both.
app-client-id = "<app-client-id>"
app-private-key-file = "<absolute-path-to-app-key>" # absolute path; mode 0600 or 0400
# A token file replaces the App above for every target without its own token-file or App.
# token-file = "<absolute-path-to-token-file>" # absolute path; mode 0600 or 0400

[runner]
# An image reference <name>[:<tag>][@<digest>] or a local image ID; a reference
# missing locally is pulled. image/build.sh tags its image actions-runner-scaler-runner:local.
image = "actions-runner-scaler-runner:local"
cpus = 1 # default
memory = "1g" # default
pids = 512 # default

[buildkit]
# An image reference <name>[:<tag>][@<digest>] or a local image ID; a reference
# missing locally is pulled. Pinned index digest printed by image/build.sh.
image = "moby/buildkit:<version>-rootless@sha256:<index-digest>"
cpus = 2 # default
memory = "2g" # default
pids = 1024 # default

[scaling]
label = "linux-arm64-deploy" # default; scale set name and runs-on label
server-limit = 0 # default; 0 uses the limit computed from Docker

[docker]
host = "unix:///var/run/docker.sock" # default; a unix:// or tcp:// URL

[log]
level = "info" # default; debug, info, warn or error

[jobcheck]
listen = "127.0.0.1:8765" # default; loopback addresses only

[shutdown]
drain-timeout = "10m" # default

# One [[targets]] entry per repository; there is no upper limit.
[[targets]]
url = "https://github.com/<owner>/<repo>" # no trailing "/" or ".git"; a repository once
max-runners = 1 # default; at least 1
idle = 0 # default; 0 to max-runners
# A token file, or a GitHub App (both keys below), replaces the [github]
# credential for this repository only; not both. [github] may then be left
# out when every repository has its own.
# token-file = "<absolute-path-to-token-file>" # absolute path; mode 0600 or 0400
# app-client-id = "<app-client-id>"
# app-private-key-file = "<absolute-path-to-app-key>" # absolute path; mode 0600 or 0400
