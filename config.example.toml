# Example configuration for actions-runner-scaler.
# Replace every <placeholder>. Keys marked "default" may be left out.
# Secrets are referenced by path only.

[github]
app-client-id = "<app-client-id>"
app-installation-id = 0 # <app-installation-id>, a positive integer
app-private-key-file = "<absolute-path-to-app-key>" # absolute path; mode 0600 or 0400

[runner]
# Local image ID printed by image/build.sh.
image = "sha256:<runner-image-id>"

[buildkit]
# Pinned index digest printed by image/build.sh.
image = "moby/buildkit:<version>-rootless@sha256:<index-digest>"

[jobcheck]
listen = "127.0.0.1:8765" # default; loopback addresses only

[shutdown]
drain-timeout = "10m" # default

# This version supports exactly one [[pools]] entry.
[[pools]]
name = "linux-arm64-deploy" # default; scale set name and runs-on label
repo-url = "https://github.com/<test-org>/<test-repo>" # no .git suffix
max = 2 # default
idle = 0 # default
runner-cpus = 1 # default
runner-memory = "1g" # default
runner-pids = 512 # default
build-cpus = 2 # default
build-memory = "2g" # default
build-pids = 1024 # default
allowed-workflows = [".github/workflows/<workflow-file>.yml"] # .yml or .yaml
allowed-events = ["push"] # default; any of push, workflow_dispatch, schedule
